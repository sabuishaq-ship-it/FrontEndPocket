name: Android CI/CD & Release Signing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./FrontEndPocket

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v5

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 3. Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 4. Run Unit Tests & Lint Check
        run: ./gradlew testDebugUnitTest lintDebug

      - name: 5. Build Release APK
        run: ./gradlew assembleRelease

      - name: 6. Sign Release APK Officially
        working-directory: .
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        run: |
          echo "$SIGNING_KEY" | base64 --decode > release-key.jks
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          UNSIGNED_APK=$(find FrontEndPocket/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          $BUILD_TOOLS/zipalign -v -p 4 "$UNSIGNED_APK" app-release-aligned.apk
          $BUILD_TOOLS/apksigner sign \
            --ks release-key.jks \
            --ks-key-alias pocketkey \
            --ks-pass pass:"$KEY_STORE_PASSWORD" \
            --key-pass pass:"$KEY_STORE_PASSWORD" \
            --out FrontEndPocket-Release-Signed.apk \
            app-release-aligned.apk
          rm -f release-key.jks app-release-aligned.apk

      - name: 7. Upload Signed Release APK & Lint Report
        uses: actions/upload-artifact@v6
        with:
          name: FrontEndPocket-Signed-Release
          path: |
            FrontEndPocket-Release-Signed.apk
            FrontEndPocket/app/build/reports/lint-results-debug.html
