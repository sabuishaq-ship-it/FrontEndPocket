name: Android CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./FrontEndPocket

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 3. Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 4. Run Lint & Unit Tests
        run: ./gradlew lint testDebugUnitTest --continue

      - name: 5. Build Debug APK
        run: ./gradlew assembleDebug

      - name: 6. Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrontEndPocket-debug-apk
          path: FrontEndPocket/app/build/outputs/apk/debug/*.apk
