name: Android CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./FrontEndPocket

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v5

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 3. Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 4. Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: 5. Run Lint Code Quality Check
        continue-on-error: true
        run: ./gradlew lintDebug

      - name: 6. Build Debug APK
        run: ./gradlew assembleDebug

      - name: 7. Upload Debug APK & Lint Report
        uses: actions/upload-artifact@v5
        with:
          name: FrontEndPocket-Build-Outputs
          path: |
            FrontEndPocket/app/build/outputs/apk/debug/*.apk
            FrontEndPocket/app/build/reports/lint-results-debug.html
